<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arul's Smart Canteen</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen pb-24">
    
    <header class="bg-amber-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold font-mono">🏪 ARUL'S CANTEEN</h1>
        <span class="bg-amber-800 text-xs px-2 py-1 rounded">No-App Quick Order</span>
    </header>

    <!-- Interactive Menu Grid Container -->
    <main class="max-w-md mx-auto p-4 space-y-4" id="menu-container">
        <h2 class="text-gray-600 font-semibold text-sm uppercase tracking-wider">Live Kitchen Counter</h2>
        
        <!-- Individual Menu Cards (Populated Dynamically in Live Env) -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-gray-800 text-lg">Ghee Podi Dosa</h3>
                <p class="text-amber-600 font-semibold">₹55.00</p>
            </div>
            <button onclick="addToCart('Ghee Podi Dosa', 55)" class="bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow-sm active:scale-95 transition-transform">+ Add</button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <h3 class="font-bold text-gray-800 text-lg">Hot Filter Coffee</h3>
                <p class="text-amber-600 font-semibold">₹15.00</p>
            </div>
            <button onclick="addToCart('Hot Filter Coffee', 15)" class="bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow-sm active:scale-95 transition-transform">+ Add</button>
        </div>
    </main>

    <!-- Sticky Checkout Action Bar Overlay -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-xl max-w-md mx-auto">
        <div class="flex justify-between items-center mb-3">
            <span class="text-gray-500 font-medium">Your Selection:</span>
            <span id="cart-total" class="text-xl font-black text-gray-900">₹0.00</span>
        </div>
        <button onclick="triggerUPIPayment()" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl shadow-md active:bg-emerald-700 transition-colors tracking-wide text-center block">
            👉 PAY VIA ANY UPI APP
        </button>
    </footer>

    <script>
        let currentCart = [];
        let totalBill = 0;

        function addToCart(name, price) {
            currentCart.push({name, price});
            totalBill += price;
            document.getElementById('cart-total').innerText = "₹" + totalBill.toFixed(2);
        }

        function triggerUPIPayment() {
            if (totalBill === 0) return alert("Your basket is empty!");
            
            // CONSTRUCTING INDUSTRIAL UPI INTENT STRING
            const upiId = "canteenmerchant@okaxis"; 
            const merchantName = "Arul Canteen Enterprise";
            const transactionNote = "Canteen Token Order";
            
            const upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(merchantName)}&am=${totalBill.toFixed(2)}&tn=${encodeURIComponent(transactionNote)}&cu=INR`;
            
            // Launches native phone overlay drawer (GPay, PhonePe, Paytm, etc.)
            window.location.href = upiUrl;
        }
    </script>
</body>
</html>
